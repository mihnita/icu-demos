server.modules = ( "mod_alias", "mod_rewrite", "mod_redirect", "mod_cgi", "mod_access" )
server.document-root = "/var/www/localhost/htdocs/"
index-file.names = ( "index.html" )

server.port = 8080

# Block known crawlers/scrapers by User-Agent
$HTTP["useragent"] =~ "(Amazonbot|amazon-Quick-on-behalf|meta-externalagent|Baiduspider|YisouSpider|Applebot|PetalBot|Bytespider|AhrefsBot|SemrushBot)" {
    url.access-deny = ( "" )
}

# Block empty User-Agent (many headless scrapers)
$HTTP["useragent"] == "" {
    url.access-deny = ( "" )
}

# Block Alibaba addresses that cause most trafic.
# The User-Agent has no indication it is a crawler, it imitates a real browser.
# The mod_limit, mod_evasive, mod_limit modules would be better, but none of them
# is available on alpine. And building them from sources is too much of a pain.
$HTTP["remoteip"] == "47.82.10.0/24" {
    url.access-deny = ("")
}
$HTTP["remoteip"] == "47.82.11.0/24" {
    url.access-deny = ("")
}

mimetype.assign = (
  ".html" => "text/html",
  ".txt" => "text/plain",
  ".jpg" => "image/jpeg",
  ".png" => "image/png"
)

url.rewrite-once = (
  "^/icu-bin/collation.html" => "/collation.html"
)

$HTTP["url"] =~ "^/icu-bin/" {
    alias.url += ( "/icu-bin/" => "/home/build/icu/usr/bin/" )
    cgi.assign = ( "" => "" )
}
